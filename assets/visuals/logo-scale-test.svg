<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Test one logo at three scales</title>
<desc id="desc">Teaching diagram for Module 3: The core shape should survive every intended application.</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5L0 7Z" fill="#0d756b"/></marker><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#102a35}.title{font-size:37px;font-weight:800;fill:#fff}.subtitle{font-size:20px;fill:#dffbf4}.label{font-size:22px;font-weight:800}.note{font-size:17px;fill:#334f59}.callout{font-size:16px;font-weight:700}.footer{font-size:15px;fill:#52656d}.centreText{font-size:22px;font-weight:800;fill:#fff}.card{stroke:#9ebdb7;stroke-width:2}.c0{fill:#eef7f5}.c1{fill:#fff1eb}.c2{fill:#fff7d9}.c3{fill:#e9e2fb}.centre{fill:#0d756b;stroke:#07564f;stroke-width:3}.dot{stroke:#102a35;stroke-width:2}.d0{fill:#0d756b}.d1{fill:#ed6a4a}.d2{fill:#f2c14e}.d3{fill:#7a3df0}.arrow,.loop{fill:none;stroke:#0d756b;stroke-width:5;marker-end:url(#arrowhead)}.link{fill:none;stroke:#52656d;stroke-width:3}.versus{font-size:13px;font-weight:800;letter-spacing:1px;fill:#52656d}
</style></defs>
<rect width="1200" height="675" fill="#fffdf8"/><rect width="1200" height="125" fill="#0b3f4b"/>
<text x="60" y="58" class="title">Test one logo at three scales</text><text x="60" y="94" class="subtitle">The core shape should survive every intended application.</text>
<rect x="60" y="215" width="341.3333333333333" height="235" rx="24" class="card c0"/><circle cx="230.66666666666666" cy="269" r="24" class="dot d0"/><text x="230.66666666666666" y="330" text-anchor="middle" class="label">Small icon</text><text x="230.66666666666666" y="364" text-anchor="middle" class="note">Can you recognise the mark at</text><text x="230.66666666666666" y="389" text-anchor="middle" class="note">thumbnail size?</text><path d="M 406.3333333333333 333 H 422.3333333333333" class="arrow"/><rect x="429.3333333333333" y="215" width="341.3333333333333" height="235" rx="24" class="card c1"/><circle cx="600" cy="269" r="36" class="dot d1"/><text x="600" y="330" text-anchor="middle" class="label">Screen header</text><text x="600" y="364" text-anchor="middle" class="note">Is the full name still clear on a</text><text x="600" y="389" text-anchor="middle" class="note">phone?</text><path d="M 775.6666666666666 333 H 791.6666666666666" class="arrow"/><rect x="798.6666666666666" y="215" width="341.3333333333333" height="235" rx="24" class="card c2"/><circle cx="969.3333333333333" cy="269" r="48" class="dot d2"/><text x="969.3333333333333" y="330" text-anchor="middle" class="label">Large poster</text><text x="969.3333333333333" y="364" text-anchor="middle" class="note">Do edges and spacing remain</text><text x="969.3333333333333" y="389" text-anchor="middle" class="note">controlled?</text><text x="600" y="515" text-anchor="middle" class="callout">A useful logo stays recognisable without relying on one size.</text>
<text x="60" y="642" class="footer">Fast Food Futures · Module 3 · Explanatory visual</text>
</svg>
