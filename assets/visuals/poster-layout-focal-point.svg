<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Build a poster around one focal point</title>
<desc id="desc">Teaching diagram for Module 5: Every element needs a clear job in the reading order.</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5L0 7Z" fill="#0d756b"/></marker><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#102a35}.title{font-size:37px;font-weight:800;fill:#fff}.subtitle{font-size:20px;fill:#dffbf4}.label{font-size:22px;font-weight:800}.note{font-size:17px;fill:#334f59}.callout{font-size:16px;font-weight:700}.footer{font-size:15px;fill:#52656d}.centreText{font-size:22px;font-weight:800;fill:#fff}.card{stroke:#9ebdb7;stroke-width:2}.c0{fill:#eef7f5}.c1{fill:#fff1eb}.c2{fill:#fff7d9}.c3{fill:#e9e2fb}.centre{fill:#0d756b;stroke:#07564f;stroke-width:3}.dot{stroke:#102a35;stroke-width:2}.d0{fill:#0d756b}.d1{fill:#ed6a4a}.d2{fill:#f2c14e}.d3{fill:#7a3df0}.arrow,.loop{fill:none;stroke:#0d756b;stroke-width:5;marker-end:url(#arrowhead)}.link{fill:none;stroke:#52656d;stroke-width:3}.versus{font-size:13px;font-weight:800;letter-spacing:1px;fill:#52656d}
</style></defs>
<rect width="1200" height="675" fill="#fffdf8"/><rect width="1200" height="125" fill="#0b3f4b"/>
<text x="60" y="58" class="title">Build a poster around one focal point</text><text x="60" y="94" class="subtitle">Every element needs a clear job in the reading order.</text>
<rect x="110" y="165" width="980" height="104" rx="22" class="card c0"/><text x="600" y="204" text-anchor="middle" class="label">1 · Headline + image</text><text x="600" y="238" text-anchor="middle" class="note">Make the central offer or idea</text><text x="600" y="263" text-anchor="middle" class="note">immediately clear</text><rect x="180" y="297" width="840" height="104" rx="22" class="card c1"/><text x="600" y="336" text-anchor="middle" class="label">2 · Supporting details</text><text x="600" y="370" text-anchor="middle" class="note">Add only what helps the viewer</text><text x="600" y="395" text-anchor="middle" class="note">understand or decide</text><rect x="250" y="429" width="700" height="104" rx="22" class="card c2"/><text x="600" y="468" text-anchor="middle" class="label">3 · Call to action + identity</text><text x="600" y="502" text-anchor="middle" class="note">Show the next step and who is</text><text x="600" y="527" text-anchor="middle" class="note">communicating</text>
<text x="60" y="642" class="footer">Fast Food Futures · Module 5 · Explanatory visual</text>
</svg>
