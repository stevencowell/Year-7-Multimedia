<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">The design brief is a loop</title>
<desc id="desc">Teaching diagram for Module 1: Each decision should connect purpose, users and evidence.</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5L0 7Z" fill="#0d756b"/></marker><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#102a35}.title{font-size:37px;font-weight:800;fill:#fff}.subtitle{font-size:20px;fill:#dffbf4}.label{font-size:22px;font-weight:800}.note{font-size:17px;fill:#334f59}.callout{font-size:16px;font-weight:700}.footer{font-size:15px;fill:#52656d}.centreText{font-size:22px;font-weight:800;fill:#fff}.card{stroke:#9ebdb7;stroke-width:2}.c0{fill:#eef7f5}.c1{fill:#fff1eb}.c2{fill:#fff7d9}.c3{fill:#e9e2fb}.centre{fill:#0d756b;stroke:#07564f;stroke-width:3}.dot{stroke:#102a35;stroke-width:2}.d0{fill:#0d756b}.d1{fill:#ed6a4a}.d2{fill:#f2c14e}.d3{fill:#7a3df0}.arrow,.loop{fill:none;stroke:#0d756b;stroke-width:5;marker-end:url(#arrowhead)}.link{fill:none;stroke:#52656d;stroke-width:3}.versus{font-size:13px;font-weight:800;letter-spacing:1px;fill:#52656d}
</style></defs>
<rect width="1200" height="675" fill="#fffdf8"/><rect width="1200" height="125" fill="#0b3f4b"/>
<text x="60" y="58" class="title">The design brief is a loop</text><text x="60" y="94" class="subtitle">Each decision should connect purpose, users and evidence.</text>
<path d="M 410 250 H 755 V 475 H 410 V 250" class="loop"/><rect x="110" y="185" width="405" height="145" rx="24" class="card c0"/><text x="134" y="231" text-anchor="start" class="label">1 · Problem</text><text x="134" y="265" text-anchor="start" class="note">What needs to be communicated or</text><text x="134" y="290" text-anchor="start" class="note">improved?</text><rect x="685" y="185" width="405" height="145" rx="24" class="card c1"/><text x="709" y="231" text-anchor="start" class="label">2 · Audience</text><text x="709" y="265" text-anchor="start" class="note">Who will see it, and what do they</text><text x="709" y="290" text-anchor="start" class="note">need?</text><rect x="685" y="410" width="405" height="145" rx="24" class="card c2"/><text x="709" y="456" text-anchor="start" class="label">3 · Criteria</text><text x="709" y="490" text-anchor="start" class="note">What would make the result</text><text x="709" y="515" text-anchor="start" class="note">successful?</text><rect x="110" y="410" width="405" height="145" rx="24" class="card c3"/><text x="134" y="456" text-anchor="start" class="label">4 · Evidence</text><text x="134" y="490" text-anchor="start" class="note">What will prove the design works?</text>
<text x="60" y="642" class="footer">Fast Food Futures · Module 1 · Explanatory visual</text>
</svg>

