<title id="title">Feedback is useful when it changes the work</title><desc id="desc">Teaching diagram for Module 10: A respectful comment should connect criteria, evidence and revision.</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5L0 7Z" fill="#0d756b"/></marker><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#102a35}.title{font-size:37px;font-weight:800;fill:#fff}.subtitle{font-size:20px;fill:#dffbf4}.label{font-size:22px;font-weight:800}.note{font-size:17px;fill:#334f59}.callout{font-size:16px;font-weight:700}.footer{font-size:15px;fill:#52656d}.centreText{font-size:22px;font-weight:800;fill:#fff}.card{stroke:#9ebdb7;stroke-width:2}.c0{fill:#eef7f5}.c1{fill:#fff1eb}.c2{fill:#fff7d9}.c3{fill:#e9e2fb}.centre{fill:#0d756b;stroke:#07564f;stroke-width:3}.dot{stroke:#102a35;stroke-width:2}.d0{fill:#0d756b}.d1{fill:#ed6a4a}.d2{fill:#f2c14e}.d3{fill:#7a3df0}.arrow,.loop{fill:none;stroke:#0d756b;stroke-width:5;marker-end:url(#arrowhead)}.link{fill:none;stroke:#52656d;stroke-width:3}.versus{font-size:13px;font-weight:800;letter-spacing:1px;fill:#52656d}
</style></defs><rect width="1200" height="675" fill="#fffdf8"/><rect width="1200" height="125" fill="#0b3f4b"/><text x="60" y="58" class="title">Feedback is useful when it changes the work</text><text x="60" y="94" class="subtitle">A respectful comment should connect criteria, evidence and revision.</text><path d="M410 250H755V475H410V250" class="loop"/><rect x="110" y="185" width="405" height="145" rx="24" class="card c0"/><text x="134" y="231" text-anchor="start" class="label">1 · Draft</text><text x="134" y="265" text-anchor="start" class="note">Show enough work for a useful</text><text x="134" y="290" text-anchor="start" class="note">response</text><rect x="685" y="185" width="405" height="145" rx="24" class="card c1"/><text x="709" y="231" text-anchor="start" class="label">2 · Criteria</text><text x="709" y="265" text-anchor="start" class="note">Name what success looks like</text><rect x="685" y="410" width="405" height="145" rx="24" class="card c2"/><text x="709" y="456" text-anchor="start" class="label">3 · Feedback</text><text x="709" y="490" text-anchor="start" class="note">Point to evidence, not personal</text><text x="709" y="515" text-anchor="start" class="note">taste</text><rect x="110" y="410" width="405" height="145" rx="24" class="card c3"/><text x="134" y="456" text-anchor="start" class="label">4 · Revision</text><text x="134" y="490" text-anchor="start" class="note">Change, retest and explain the</text><text x="134" y="515" text-anchor="start" class="note">decision</text><text x="60" y="642" class="footer">Fast Food Futures · Module 10 · Explanatory visual</text></svg>

