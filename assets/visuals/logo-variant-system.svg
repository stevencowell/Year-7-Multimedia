<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">A logo system uses planned variants</title>
<desc id="desc">Teaching diagram for Module 3: Variants adapt the same identity; they are not unrelated redesigns.</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5L0 7Z" fill="#0d756b"/></marker><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#102a35}.title{font-size:37px;font-weight:800;fill:#fff}.subtitle{font-size:20px;fill:#dffbf4}.label{font-size:22px;font-weight:800}.note{font-size:17px;fill:#334f59}.callout{font-size:16px;font-weight:700}.footer{font-size:15px;fill:#52656d}.centreText{font-size:22px;font-weight:800;fill:#fff}.centreNote{font-size:17px;fill:#dffbf4}.card{stroke:#9ebdb7;stroke-width:2}.c0{fill:#eef7f5}.c1{fill:#fff1eb}.c2{fill:#fff7d9}.c3{fill:#e9e2fb}.centre{fill:#0d756b;stroke:#07564f;stroke-width:3}.dot{stroke:#102a35;stroke-width:2}.d0{fill:#0d756b}.d1{fill:#ed6a4a}.d2{fill:#f2c14e}.d3{fill:#7a3df0}.arrow,.loop{fill:none;stroke:#0d756b;stroke-width:5;marker-end:url(#arrowhead)}.link{fill:none;stroke:#52656d;stroke-width:3}.versus{font-size:13px;font-weight:800;letter-spacing:1px;fill:#52656d}
</style></defs>
<rect width="1200" height="675" fill="#fffdf8"/><rect width="1200" height="125" fill="#0b3f4b"/>
<text x="60" y="58" class="title">A logo system uses planned variants</text><text x="60" y="94" class="subtitle">Variants adapt the same identity; they are not unrelated redesigns.</text>
<ellipse cx="600" cy="335" rx="170" ry="88" class="centre"/><text x="600" y="325" text-anchor="middle" class="centreText">MASTER LOGO</text><text x="600" y="359" text-anchor="middle" class="centreNote">Core shape + palette</text><path d="M 365 240 L 430 275" class="link"/><rect x="65" y="175" width="300" height="130" rx="22" class="card c0"/><text x="85" y="217" text-anchor="start" class="label">Full lock-up</text><text x="85" y="251" text-anchor="start" class="note">Name and symbol together</text><path d="M 835 240 L 770 275" class="link"/><rect x="835" y="175" width="300" height="130" rx="22" class="card c1"/><text x="855" y="217" text-anchor="start" class="label">Stacked lock-up</text><text x="855" y="251" text-anchor="start" class="note">A compact vertical arrangement</text><path d="M 365 495 L 430 450" class="link"/><rect x="65" y="430" width="300" height="130" rx="22" class="card c2"/><text x="85" y="472" text-anchor="start" class="label">Mark only</text><text x="85" y="506" text-anchor="start" class="note">Use only where the identity is</text><text x="85" y="531" text-anchor="start" class="note">already known</text><path d="M 835 495 L 770 450" class="link"/><rect x="835" y="430" width="300" height="130" rx="22" class="card c3"/><text x="855" y="472" text-anchor="start" class="label">Single colour</text><text x="855" y="506" text-anchor="start" class="note">A fallback for limited</text><text x="855" y="531" text-anchor="start" class="note">reproduction</text>
<text x="60" y="642" class="footer">Fast Food Futures · Module 3 · Explanatory visual</text>
</svg>
