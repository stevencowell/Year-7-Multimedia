<title id="title">Plan motion as a sequence of states</title><desc id="desc">Teaching diagram for Module 7: Decide what changes — and what stays stable — before animating.</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5L0 7Z" fill="#0d756b"/></marker><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#102a35}.title{font-size:37px;font-weight:800;fill:#fff}.subtitle{font-size:20px;fill:#dffbf4}.label{font-size:22px;font-weight:800}.note{font-size:17px;fill:#334f59}.callout{font-size:16px;font-weight:700}.footer{font-size:15px;fill:#52656d}.centreText{font-size:22px;font-weight:800;fill:#fff}.card{stroke:#9ebdb7;stroke-width:2}.c0{fill:#eef7f5}.c1{fill:#fff1eb}.c2{fill:#fff7d9}.c3{fill:#e9e2fb}.centre{fill:#0d756b;stroke:#07564f;stroke-width:3}.dot{stroke:#102a35;stroke-width:2}.d0{fill:#0d756b}.d1{fill:#ed6a4a}.d2{fill:#f2c14e}.d3{fill:#7a3df0}.arrow,.loop{fill:none;stroke:#0d756b;stroke-width:5;marker-end:url(#arrowhead)}.link{fill:none;stroke:#52656d;stroke-width:3}.versus{font-size:13px;font-weight:800;letter-spacing:1px;fill:#52656d}
</style></defs><rect width="1200" height="675" fill="#fffdf8"/><rect width="1200" height="125" fill="#0b3f4b"/><text x="60" y="58" class="title">Plan motion as a sequence of states</text><text x="60" y="94" class="subtitle">Decide what changes — and what stays stable — before animating.</text><rect x="60" y="215" width="341.3333333333333" height="235" rx="24" class="card c0"/><circle cx="230.66666666666666" cy="269" r="24" class="dot d0"/><text x="230.66666666666666" y="330" text-anchor="middle" class="label">State A</text><text x="230.66666666666666" y="364" text-anchor="middle" class="note">Establish the product, logo and</text><text x="230.66666666666666" y="389" text-anchor="middle" class="note">starting position</text><path d="M 406.3333333333333 333 H 422.3333333333333" class="arrow"/><rect x="429.3333333333333" y="215" width="341.3333333333333" height="235" rx="24" class="card c1"/><circle cx="600" cy="269" r="36" class="dot d1"/><text x="600" y="330" text-anchor="middle" class="label">State B</text><text x="600" y="364" text-anchor="middle" class="note">Move one focus element while</text><text x="600" y="389" text-anchor="middle" class="note">identity remains stable</text><path d="M 775.6666666666666 333 H 791.6666666666666" class="arrow"/><rect x="798.6666666666666" y="215" width="341.3333333333333" height="235" rx="24" class="card c2"/><circle cx="969.3333333333333" cy="269" r="48" class="dot d2"/><text x="969.3333333333333" y="330" text-anchor="middle" class="label">State C</text><text x="969.3333333333333" y="364" text-anchor="middle" class="note">Finish with the message and action</text><text x="969.3333333333333" y="389" text-anchor="middle" class="note">clearly visible</text><text x="600" y="515" text-anchor="middle" class="callout">The viewer should understand the change without guessing.</text><text x="60" y="642" class="footer">Fast Food Futures · Module 7 · Explanatory visual</text></svg>
