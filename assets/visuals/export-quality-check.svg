<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Check the MP4 before calling it finished</title><desc id="desc">Teaching diagram for Module 7: A successful export is not proof that the advertisement works.</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5L0 7Z" fill="#0d756b"/></marker><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#102a35}.title{font-size:37px;font-weight:800;fill:#fff}.subtitle{font-size:20px;fill:#dffbf4}.label{font-size:22px;font-weight:800}.note{font-size:15px;fill:#334f59}.callout{font-size:16px;font-weight:700}.footer{font-size:15px;fill:#52656d}.centreText{font-size:22px;font-weight:800;fill:#fff}.card{stroke:#9ebdb7;stroke-width:2}.c0{fill:#eef7f5}.c1{fill:#fff1eb}.c2{fill:#fff7d9}.c3{fill:#e9e2fb}.centre{fill:#0d756b;stroke:#07564f;stroke-width:3}.dot{stroke:#102a35;stroke-width:2}.d0{fill:#0d756b}.d1{fill:#ed6a4a}.d2{fill:#f2c14e}.d3{fill:#7a3df0}.arrow,.loop{fill:none;stroke:#0d756b;stroke-width:5;marker-end:url(#arrowhead)}.link{fill:none;stroke:#52656d;stroke-width:3}.versus{font-size:13px;font-weight:800;letter-spacing:1px;fill:#52656d}
</style></defs><rect width="1200" height="675" fill="#fffdf8"/><rect width="1200" height="125" fill="#0b3f4b"/><text x="60" y="58" class="title">Check the MP4 before calling it finished</text><text x="60" y="94" class="subtitle">A successful export is not proof that the advertisement works.</text><rect x="60" y="215" width="249" height="235" rx="24" class="card c0"/><circle cx="184.5" cy="269" r="28" class="dot d0"/><text x="184.5" y="330" text-anchor="middle" class="label">Canvas</text><text x="184.5" y="364" text-anchor="middle" class="note">Confirm the intended 1080 × 1920</text><text x="184.5" y="389" text-anchor="middle" class="note">portrait format</text><path d="M 314 333 H 330" class="arrow"/><rect x="337" y="215" width="249" height="235" rx="24" class="card c1"/><circle cx="461.5" cy="269" r="28" class="dot d1"/><text x="461.5" y="330" text-anchor="middle" class="label">Timing</text><text x="461.5" y="364" text-anchor="middle" class="note">Watch every transition at normal</text><text x="461.5" y="389" text-anchor="middle" class="note">speed</text><path d="M 591 333 H 607" class="arrow"/><rect x="614" y="215" width="249" height="235" rx="24" class="card c2"/><circle cx="738.5" cy="269" r="28" class="dot d2"/><text x="738.5" y="330" text-anchor="middle" class="label">Content</text><text x="738.5" y="364" text-anchor="middle" class="note">Check logo, slogan and price</text><text x="738.5" y="389" text-anchor="middle" class="note">element remain readable</text><path d="M 868 333 H 884" class="arrow"/><rect x="891" y="215" width="249" height="235" rx="24" class="card c3"/><circle cx="1015.5" cy="269" r="28" class="dot d3"/><text x="1015.5" y="330" text-anchor="middle" class="label">Evidence</text><text x="1015.5" y="364" text-anchor="middle" class="note">Open the MP4 again and keep a</text><text x="1015.5" y="389" text-anchor="middle" class="note">recoverable copy</text><text x="600" y="515" text-anchor="middle" class="callout">Replay the exported file; do not trust the editing preview alone.</text><text x="60" y="642" class="footer">Fast Food Futures · Module 7 · Explanatory visual</text></svg>
