<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Put environmental claims through a check</title><desc id="desc">Teaching diagram for Module 8: Vague green language is not a substitute for evidence.</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5L0 7Z" fill="#0d756b"/></marker><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#102a35}.title{font-size:37px;font-weight:800;fill:#fff}.subtitle{font-size:20px;fill:#dffbf4}.label{font-size:22px;font-weight:800}.note{font-size:17px;fill:#334f59}.callout{font-size:16px;font-weight:700}.footer{font-size:15px;fill:#52656d}.centreText{font-size:22px;font-weight:800;fill:#fff}.card{stroke:#9ebdb7;stroke-width:2}.c0{fill:#eef7f5}.c1{fill:#fff1eb}.c2{fill:#fff7d9}.c3{fill:#e9e2fb}.centre{fill:#0d756b;stroke:#07564f;stroke-width:3}.dot{stroke:#102a35;stroke-width:2}.d0{fill:#0d756b}.d1{fill:#ed6a4a}.d2{fill:#f2c14e}.d3{fill:#7a3df0}.arrow,.loop{fill:none;stroke:#0d756b;stroke-width:5;marker-end:url(#arrowhead)}.link{fill:none;stroke:#52656d;stroke-width:3}.versus{font-size:13px;font-weight:800;letter-spacing:1px;fill:#52656d}
</style></defs><rect width="1200" height="675" fill="#fffdf8"/><rect width="1200" height="125" fill="#0b3f4b"/><text x="60" y="58" class="title">Put environmental claims through a check</text><text x="60" y="94" class="subtitle">Vague green language is not a substitute for evidence.</text><path d="M100 165H1100L1055 253H145Z" class="card c0"/><text x="600" y="202" text-anchor="middle" class="label">The claim</text><text x="600" y="236" text-anchor="middle" class="note">What exactly is being promised?</text><path d="M190 277H1010L965 365H235Z" class="card c1"/><text x="600" y="314" text-anchor="middle" class="label">Specificity</text><text x="600" y="348" text-anchor="middle" class="note">Does it name the product, action</text><text x="600" y="373" text-anchor="middle" class="note">and limit?</text><path d="M280 389H920L875 477H325Z" class="card c2"/><text x="600" y="426" text-anchor="middle" class="label">Evidence</text><text x="600" y="460" text-anchor="middle" class="note">Can a viewer find credible support</text><text x="600" y="485" text-anchor="middle" class="note">for it?</text><path d="M370 501H830L785 589H415Z" class="card c3"/><text x="600" y="538" text-anchor="middle" class="label">Transparent wording</text><text x="600" y="572" text-anchor="middle" class="note">State only what the evidence supports.</text><text x="60" y="642" class="footer">Fast Food Futures · Module 8 · Explanatory visual</text></svg>
