<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Alignment supports fast scanning</title>
<desc id="desc">Teaching diagram for Module 4: Shared edges help the eye compare items without hunting.</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5L0 7Z" fill="#0d756b"/></marker><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#102a35}.title{font-size:37px;font-weight:800;fill:#fff}.subtitle{font-size:20px;fill:#dffbf4}.label{font-size:22px;font-weight:800}.note{font-size:17px;fill:#334f59}.callout{font-size:16px;font-weight:700}.footer{font-size:15px;fill:#52656d}.centreText{font-size:22px;font-weight:800;fill:#fff}.card{stroke:#9ebdb7;stroke-width:2}.c0{fill:#eef7f5}.c1{fill:#fff1eb}.c2{fill:#fff7d9}.c3{fill:#e9e2fb}.centre{fill:#0d756b;stroke:#07564f;stroke-width:3}.dot{stroke:#102a35;stroke-width:2}.d0{fill:#0d756b}.d1{fill:#ed6a4a}.d2{fill:#f2c14e}.d3{fill:#7a3df0}.arrow,.loop{fill:none;stroke:#0d756b;stroke-width:5;marker-end:url(#arrowhead)}.link{fill:none;stroke:#52656d;stroke-width:3}.versus{font-size:13px;font-weight:800;letter-spacing:1px;fill:#52656d}
</style></defs>
<rect width="1200" height="675" fill="#fffdf8"/><rect width="1200" height="125" fill="#0b3f4b"/>
<text x="60" y="58" class="title">Alignment supports fast scanning</text><text x="60" y="94" class="subtitle">Shared edges help the eye compare items without hunting.</text>
<text x="600" y="160" text-anchor="middle" class="versus">COMPARE</text><rect x="65" y="180" width="510" height="320" rx="28" class="card c0"/><circle cx="320" cy="248" r="32" class="dot d0"/><text x="320" y="310" text-anchor="middle" class="label">Scattered layout</text><text x="320" y="344" text-anchor="middle" class="note">Names, details and prices start at</text><text x="320" y="369" text-anchor="middle" class="note">changing positions</text><text x="320" y="425" text-anchor="middle" class="callout">The eye must repeatedly search.</text><rect x="625" y="180" width="510" height="320" rx="28" class="card c2"/><circle cx="880" cy="248" r="32" class="dot d2"/><text x="880" y="310" text-anchor="middle" class="label">Aligned layout</text><text x="880" y="344" text-anchor="middle" class="note">Headings share an edge; prices</text><text x="880" y="369" text-anchor="middle" class="note">form a clear column</text><text x="880" y="425" text-anchor="middle" class="callout">Comparison becomes more predictable.</text>
<text x="60" y="642" class="footer">Fast Food Futures · Module 4 · Explanatory visual</text>
</svg>
