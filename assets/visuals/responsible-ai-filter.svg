<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Responsible AI: ideas through a student filter</title>
<desc id="desc">Teaching diagram for Module 1: The student verifies, selects, changes and explains every final decision.</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5L0 7Z" fill="#0d756b"/></marker><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#102a35}.title{font-size:37px;font-weight:800;fill:#fff}.subtitle{font-size:20px;fill:#dffbf4}.label{font-size:22px;font-weight:800}.note{font-size:17px;fill:#334f59}.callout{font-size:16px;font-weight:700}.footer{font-size:15px;fill:#52656d}.centreText{font-size:22px;font-weight:800;fill:#fff}.card{stroke:#9ebdb7;stroke-width:2}.c0{fill:#eef7f5}.c1{fill:#fff1eb}.c2{fill:#fff7d9}.c3{fill:#e9e2fb}.centre{fill:#0d756b;stroke:#07564f;stroke-width:3}.dot{stroke:#102a35;stroke-width:2}.d0{fill:#0d756b}.d1{fill:#ed6a4a}.d2{fill:#f2c14e}.d3{fill:#7a3df0}.arrow,.loop{fill:none;stroke:#0d756b;stroke-width:5;marker-end:url(#arrowhead)}.link{fill:none;stroke:#52656d;stroke-width:3}.versus{font-size:13px;font-weight:800;letter-spacing:1px;fill:#52656d}
</style></defs>
<rect width="1200" height="675" fill="#fffdf8"/><rect width="1200" height="125" fill="#0b3f4b"/>
<text x="60" y="58" class="title">Responsible AI: ideas through a student filter</text><text x="60" y="94" class="subtitle">The student verifies, selects, changes and explains every final decision.</text>
<path d="M 100 165 H 1100 L 1055 253 H 145 Z" class="card c0"/><text x="600" y="202" text-anchor="middle" class="label">AI suggestions</text><text x="600" y="236" text-anchor="middle" class="note">Possible starting points — not</text><text x="600" y="261" text-anchor="middle" class="note">finished work</text><path d="M 190 277 H 1010 L 965 365 H 235 Z" class="card c1"/><text x="600" y="314" text-anchor="middle" class="label">Check</text><text x="600" y="348" text-anchor="middle" class="note">Is it accurate, appropriate and</text><text x="600" y="373" text-anchor="middle" class="note">permitted?</text><path d="M 280 389 H 920 L 875 477 H 325 Z" class="card c2"/><text x="600" y="426" text-anchor="middle" class="label">Choose + change</text><text x="600" y="460" text-anchor="middle" class="note">Combine, reject or revise using</text><text x="600" y="485" text-anchor="middle" class="note">your own brief</text><path d="M 370 501 H 830 L 785 589 H 415 Z" class="card c3"/><text x="600" y="538" text-anchor="middle" class="label">Own the decision</text><text x="600" y="572" text-anchor="middle" class="note">Explain why it suits the audience.</text>
<text x="60" y="642" class="footer">Fast Food Futures · Module 1 · Explanatory visual</text>
</svg>
