<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Persuasion becomes stronger with evidence</title><desc id="desc">Teaching diagram for Module 8: Move from attention to a specific, supportable claim.</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5L0 7Z" fill="#0d756b"/></marker><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#102a35}.title{font-size:37px;font-weight:800;fill:#fff}.subtitle{font-size:20px;fill:#dffbf4}.label{font-size:22px;font-weight:800}.note{font-size:17px;fill:#334f59}.callout{font-size:16px;font-weight:700}.footer{font-size:15px;fill:#52656d}.centreText{font-size:22px;font-weight:800;fill:#fff}.card{stroke:#9ebdb7;stroke-width:2}.c0{fill:#eef7f5}.c1{fill:#fff1eb}.c2{fill:#fff7d9}.c3{fill:#e9e2fb}.centre{fill:#0d756b;stroke:#07564f;stroke-width:3}.dot{stroke:#102a35;stroke-width:2}.d0{fill:#0d756b}.d1{fill:#ed6a4a}.d2{fill:#f2c14e}.d3{fill:#7a3df0}.arrow,.loop{fill:none;stroke:#0d756b;stroke-width:5;marker-end:url(#arrowhead)}.link{fill:none;stroke:#52656d;stroke-width:3}.versus{font-size:13px;font-weight:800;letter-spacing:1px;fill:#52656d}
</style></defs><rect width="1200" height="675" fill="#fffdf8"/><rect width="1200" height="125" fill="#0b3f4b"/><text x="60" y="58" class="title">Persuasion becomes stronger with evidence</text><text x="60" y="94" class="subtitle">Move from attention to a specific, supportable claim.</text><rect x="110" y="155" width="980" height="92" rx="22" class="card c0"/><text x="600" y="189" text-anchor="middle" class="label">1 · Attention</text><text x="600" y="223" text-anchor="middle" class="note">A visual or phrase earns a moment</text><text x="600" y="248" text-anchor="middle" class="note">of notice</text><rect x="180" y="267" width="840" height="92" rx="22" class="card c1"/><text x="600" y="301" text-anchor="middle" class="label">2 · Relevant benefit</text><text x="600" y="335" text-anchor="middle" class="note">The message connects to a real</text><text x="600" y="360" text-anchor="middle" class="note">audience need</text><rect x="250" y="379" width="700" height="92" rx="22" class="card c2"/><text x="600" y="413" text-anchor="middle" class="label">3 · Support</text><text x="600" y="447" text-anchor="middle" class="note">Specific evidence or transparent</text><text x="600" y="472" text-anchor="middle" class="note">explanation backs the claim</text><rect x="320" y="491" width="560" height="92" rx="22" class="card c3"/><text x="600" y="525" text-anchor="middle" class="label">4 · Honest action</text><text x="600" y="559" text-anchor="middle" class="note">The call to action does not hide</text><text x="600" y="584" text-anchor="middle" class="note">important limits</text><text x="60" y="642" class="footer">Fast Food Futures · Module 8 · Explanatory visual</text></svg>
