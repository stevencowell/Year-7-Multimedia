<title id="title">One design decision can create ripple effects</title><desc id="desc">Teaching diagram for Module 8: Marketing choices connect demand, operations, waste and trust.</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5L0 7Z" fill="#0d756b"/></marker><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#102a35}.title{font-size:37px;font-weight:800;fill:#fff}.subtitle{font-size:20px;fill:#dffbf4}.label{font-size:22px;font-weight:800}.note{font-size:17px;fill:#334f59}.callout{font-size:16px;font-weight:700}.footer{font-size:15px;fill:#52656d}.centreText{font-size:22px;font-weight:800;fill:#fff}.centreNote{font-size:17px;fill:#dffbf4}.card{stroke:#9ebdb7;stroke-width:2}.c0{fill:#eef7f5}.c1{fill:#fff1eb}.c2{fill:#fff7d9}.c3{fill:#e9e2fb}.centre{fill:#0d756b;stroke:#07564f;stroke-width:3}.dot{stroke:#102a35;stroke-width:2}.d0{fill:#0d756b}.d1{fill:#ed6a4a}.d2{fill:#f2c14e}.d3{fill:#7a3df0}.arrow,.loop{fill:none;stroke:#0d756b;stroke-width:5;marker-end:url(#arrowhead)}.link{fill:none;stroke:#52656d;stroke-width:3}.versus{font-size:13px;font-weight:800;letter-spacing:1px;fill:#52656d}
</style></defs><rect width="1200" height="675" fill="#fffdf8"/><rect width="1200" height="125" fill="#0b3f4b"/><text x="60" y="58" class="title">One design decision can create ripple effects</text><text x="60" y="94" class="subtitle">Marketing choices connect demand, operations, waste and trust.</text><ellipse cx="600" cy="335" rx="170" ry="88" class="centre"/><text x="600" y="325" text-anchor="middle" class="centreText">DESIGN CHOICE</text><text x="600" y="359" text-anchor="middle" class="centreNote">message or campaign</text><path d="M 365 240L430 275" class="link"/><rect x="65" y="175" width="300" height="130" rx="22" class="card c0"/><text x="85" y="217" text-anchor="start" class="label">Audience response</text><text x="85" y="251" text-anchor="start" class="note">Interest, expectations and trust</text><text x="85" y="276" text-anchor="start" class="note">may change</text><path d="M 835 240L770 275" class="link"/><rect x="835" y="175" width="300" height="130" rx="22" class="card c1"/><text x="855" y="217" text-anchor="start" class="label">Demand</text><text x="855" y="251" text-anchor="start" class="note">More attention can change what</text><text x="855" y="276" text-anchor="start" class="note">people request</text><path d="M 365 495L430 450" class="link"/><rect x="65" y="430" width="300" height="130" rx="22" class="card c2"/><text x="85" y="472" text-anchor="start" class="label">Operations</text><text x="85" y="506" text-anchor="start" class="note">Supply, staffing and delivery may</text><text x="85" y="531" text-anchor="start" class="note">be affected</text><path d="M 835 495L770 450" class="link"/><rect x="835" y="430" width="300" height="130" rx="22" class="card c3"/><text x="855" y="472" text-anchor="start" class="label">Waste + reputation</text><text x="855" y="506" text-anchor="start" class="note">Consequences can return as costs</text><text x="855" y="531" text-anchor="start" class="note">or public response</text><text x="60" y="642" class="footer">Fast Food Futures · Module 8 · Explanatory visual</text></svg>
